<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>{% block title %}ProgressPilot{% endblock %}</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--ink:#152238;--muted:#6f7d91;--brand:#3859d9;--brand-dark:#2945b8;--soft:#edf1ff;--line:#e5eaf2;--green:#16794b;--green-bg:#e8f7ef;--red:#bd3d45;--shadow:0 8px 26px rgba(24,43,82,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:24px;padding:0 max(22px,calc((100vw - 1160px)/2));min-height:68px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:17px;font-weight:800;letter-spacing:-.4px}.brandmark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#4968ef,#2f49bd);color:white;font-size:16px;box-shadow:0 5px 12px #3859d944}.navlinks{display:flex;align-items:center;gap:6px}.navlinks a{padding:8px 12px;border-radius:9px;color:#59677d;font-weight:600}.navlinks a:hover,.navlinks a.active{background:var(--soft);color:var(--brand);text-decoration:none}.navspacer{flex:1}.user-pill{color:var(--muted);font-size:13px}.logout button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;padding:8px 10px}.logout button:hover{color:var(--ink)}
main{max-width:1160px;margin:0 auto;padding:34px 24px 64px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(26px,4vw,34px);line-height:1.2;letter-spacing:-1px;margin-bottom:8px}h2{font-size:19px;letter-spacing:-.35px;margin-bottom:16px}h3{font-size:15px}.mut{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:11px;font-weight:800;color:var(--brand)}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}.pagehead p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stat{position:relative;overflow:hidden;min-height:115px}.stat:after{content:"";position:absolute;width:74px;height:74px;right:-20px;top:-21px;border-radius:50%;background:var(--soft)}.stat b{position:relative;z-index:1;display:block;font-size:30px;line-height:1.15;letter-spacing:-1px;margin-bottom:8px}.stat span{position:relative;z-index:1;color:var(--muted);font-size:13px;font-weight:600}.stat .err{color:var(--red)}.progress-card{display:flex;justify-content:space-between;align-items:center;gap:22px;background:linear-gradient(120deg,#253b9f,#4968e9);color:#fff;border:0}.progress-card h2{font-size:21px;margin:0 0 5px}.progress-card p{margin:0;color:#e1e7ff}.progress-number{font-size:36px;font-weight:800;letter-spacing:-1px;white-space:nowrap}.bar{height:9px;background:#e9edf5;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4968ef,#35a67a);border-radius:inherit}.progress-card .bar{width:min(320px,38vw);background:#ffffff45}.progress-card .bar i{background:#9bffd0}
.task{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task .t{flex:1;min-width:180px;font-weight:650}.task .t a{color:var(--ink)}.task .t a:hover{color:var(--brand)}.task .t .mut{font-weight:400;font-size:13px}.task.done .t>a{text-decoration:line-through;color:var(--muted)}.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#f2f4f8;color:#69768b}.tag.high{background:#fff0ed;color:#b54338}.tag.status-completed{background:var(--green-bg);color:var(--green)}button,.btn,input,select,textarea{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:650}button:hover{border-color:#bdc8dc}.btn,button.p{background:var(--brand);color:#fff;border-color:var(--brand)}button.p:hover,.btn:hover{background:var(--brand-dark);color:#fff;text-decoration:none}.inline{display:inline}label{display:block;margin:10px 0 5px;font-size:13px;font-weight:650}input,select,textarea{max-width:100%}input:focus,select:focus,textarea:focus{outline:3px solid #3859d922;border-color:var(--brand)}form p{margin-bottom:12px}form p label{margin-top:0}form p input,form p select,form p textarea{display:block;width:min(100%,520px);margin-top:5px}.err{color:var(--red)}
.cols{display:flex;gap:10px;align-items:flex-end;height:128px;padding-top:12px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--muted)}.cols span{display:block;width:min(30px,80%);margin:0 auto 8px;background:linear-gradient(180deg,#7890ff,#3859d9);min-height:3px;border-radius:7px 7px 2px 2px;transition:height .25s}.cols strong{color:var(--ink);font-size:11px}.subject-row{margin:14px 0 20px}.subject-row:last-child{margin-bottom:2px}.subject-head{display:flex;justify-content:space-between;font-size:13px;font-weight:650}.subject-head span:last-child{color:var(--muted);font-weight:500}
dialog{max-width:560px;width:calc(100% - 28px);border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:24px;top:5vh;box-shadow:0 22px 80px #14213d33}dialog::backdrop{background:#14213d77;backdrop-filter:blur(3px)}dialog h2{font-size:23px}dialog ul{padding-left:22px}dialog li{margin:5px 0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title h2{margin-bottom:0}.empty{padding:22px 10px;text-align:center;color:var(--muted)}
@media(max-width:720px){.topbar{position:static;gap:10px;flex-wrap:wrap;padding:12px 16px}.brand{margin-right:auto}.navspacer{display:none}.navlinks{order:3;width:100%;overflow:auto}.navlinks a{padding:7px 10px;white-space:nowrap}.user-pill{display:none}main{padding:24px 16px 44px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:17px;border-radius:14px;margin:12px 0}.stat{min-height:100px}.stat b{font-size:26px}.progress-card{align-items:flex-start;flex-direction:column;gap:14px}.progress-card .bar{width:100%}.progress-number{font-size:30px}.pagehead{align-items:flex-start;flex-direction:column}.task{gap:7px}.task .t{flex-basis:100%}.task form{margin-right:2px}}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.stat{padding:14px}.stat b{font-size:23px}}
</style></head>
<body><nav class="topbar"><a class="brand" href="{% url 'dashboard' %}"><span class="brandmark">P</span>ProgressPilot</a>{% if user.is_authenticated %}<div class="navlinks"><a href="{% url 'dashboard' %}">Overview</a><a href="{% url 'tasks' %}">Tasks</a><a href="{% url 'calendar' %}">Calendar</a><a href="{% url 'plans' %}">Plans</a><a href="{% url 'goals' %}">Goals</a><a href="{% url 'focus' %}">Focus</a><a href="{% url 'practice' %}">Practice</a><a href="{% url 'career' %}">Career</a><a href="{% url 'analytics' %}">Analytics</a><a href="{% url 'settings' %}">Settings</a></div><span class="navspacer"></span><span class="user-pill">{{ user.username }}</span><form class="inline logout" method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>{% endif %}</nav>
<main>{% block content %}{% endblock %}</main></body></html>
